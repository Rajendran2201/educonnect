<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Slot Booking</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 20px;
    background-color: #5f43b2; /* Updated background color */
    color: white;
}

h2 {
    color: white;
}

.container {
    width: 60%;
    margin: auto;
    background: white; /* Booking container remains white */
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
}

select, input, button {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.slots-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

.slot {
    padding: 15px;
    border-radius: 8px;
    background: #2ecc71;
    color: white;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.slot:hover {
    transform: scale(1.05);
}

.booked {
    background: #e74c3c !important;
    cursor: default;
}

.popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    width: 350px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    text-align: left;
    color: black;
}

.popup input, .popup textarea {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.popup button {
    background: #27ae60;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
    width: 100%;
    border-radius: 4px;
}

.popup button.cancel {
    background: #c0392b;
}

.close-btn {
    float: right;
    font-size: 18px;
    cursor: pointer;
    color: #888;
}
    </style>
</head>
<body>
    <h2>📅 School Slot Booking</h2>
    <div class="container">
        <h3>Select Location</h3>
        <select id="place">
            <option value="">Select Place</option>
            <option value="City 1">Coimbatore</option>
            <option value="City 2">Erode</option>
            <option value="City 3">Nammakal</option>
            </select>

        <select id="school">
            <option value="">Select School Branch</option>
        </select>

        <input type="date" id="date">
        <button onclick="showSlots()">Next</button>

        <h3>Available Slots</h3>
        <div class="slots-container" id="slots"></div>
    </div>

    <!-- Popup Form -->
    <div id="popupForm" class="popup">
        <span class="close-btn" onclick="closePopup()">✖</span>
        <h3>Enter Booking Details</h3>
        <input type="text" id="name" placeholder="Your Name or Organization" required>
        <input type="text" id="event" placeholder="Workshop/Event Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="contact" placeholder="Contact Number" required>
        <textarea id="description" placeholder="Workshop Description (Optional)" rows="3"></textarea>
        <button onclick="confirmBooking()">Book Slot</button>
        <button class="cancel" onclick="closePopup()">Cancel</button>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        const schoolOptions = {
            "City 1": ["Stanes AIHS", "SSVM ","CS Acadamy"],
            "City 2": ["Bharathi Vidya Bhavan", "Vellamal","Vels Acadamy"],
            "City 3": ["Pavai Vidhyashram", "SRV BHSS","Trinity"] 
        };

        document.getElementById("place").addEventListener("change", function() {
            let city = this.value;
            let schoolSelect = document.getElementById("school");
            schoolSelect.innerHTML = `<option value="">Select School Branch</option>`;

            if (city && schoolOptions[city]) {
                schoolOptions[city].forEach(school => {
                    let option = document.createElement("option");
                    option.value = school;
                    option.textContent = school;
                    schoolSelect.appendChild(option);
                });
            }
        });

        const slots = ["09:00 AM - 10:00 AM", "10:00 AM - 11:00 AM", "11:00 AM - 12:00 PM", "01:00 PM - 02:00 PM", "02:00 PM - 03:00 PM", "03:00 PM - 04:00 PM", "04:00 PM - 05:00 PM"];
        let bookedSlots = JSON.parse(localStorage.getItem("bookedSlots")) || [];
        let selectedSlot = "";

        function showSlots() {
            let place = document.getElementById("place").value;
            let school = document.getElementById("school").value;
            let date = document.getElementById("date").value;

            if (!place || !school || !date) {
                alert("Please select all options.");
                return;
            }

            const slotContainer = document.getElementById("slots");
            slotContainer.innerHTML = "";

            slots.forEach(slot => {
                const slotDiv = document.createElement("div");
                slotDiv.classList.add("slot");
                slotDiv.textContent = slot;

                const bookedInfo = bookedSlots.find(b => b.slot === slot && b.date === date && b.school === school);
                if (bookedInfo) {
                    slotDiv.classList.add("booked");
                    slotDiv.textContent = `${slot} - Booked`;
                    slotDiv.onclick = () => alert(`📅 Slot: ${slot}\n🏢 Organization: ${bookedInfo.name}\n🎤 Event: ${bookedInfo.event}`);
                } else {
                    slotDiv.onclick = () => openPopup(slot, school, date);
                }

                slotContainer.appendChild(slotDiv);
            });
        }

        function openPopup(slot, school, date) {
            selectedSlot = { slot, school, date };
            document.getElementById("popupForm").style.display = "block";
        }

        function closePopup() {
            document.getElementById("popupForm").style.display = "none";
        }

        function confirmBooking() {
            let name = document.getElementById("name").value.trim();
            let event = document.getElementById("event").value.trim();
            let email = document.getElementById("email").value.trim();
            let contact = document.getElementById("contact").value.trim();
            let description = document.getElementById("description").value.trim();

            if (!name || !event || !email || !contact) {
                alert("Please fill in all required details.");
                return;
            }

            bookedSlots.push({ ...selectedSlot, name, event, email, contact, description });
            localStorage.setItem("bookedSlots", JSON.stringify(bookedSlots));

            alert(`✅ Slot "${selectedSlot.slot}" booked successfully by ${name}!`);
            closePopup();
            showSlots();
        }
    </script>
</body>
</html>
