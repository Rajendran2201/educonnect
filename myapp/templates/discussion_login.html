<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Teachers' Forum & Virtual Lab</title>
    <style>
      /* General Styles */
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f9;
    text-align: center;
}

/* Header */
header {
    background-color: #5f43b2;
    color: white;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
}

/* Sign-In Page */
.signin {
    background: white;
    width: 350px;
    margin: 100px auto;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}

.signin h2 {
    color: #5f43b2;
    margin-bottom: 20px;
}

.signin input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.signin a {
    width: 90%;
    background-color: #5f43b2;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    margin: 25px;
}

.signin a:hover {
    background-color: #483088;
}

/* Discussion Box */
.discussion-box {
    background: #ece6ff;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.discussion-box h3 {
    color: #5f43b2;
}

.discussion-box button {
    background-color: #5f43b2;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.discussion-box button:hover {
    background-color: #483088;
}

    </style>
</head>
<body>
    <header>EduConnect</header>

    <div class="signin" id="signinPage">
      <h3>Connect & Discuss</h3>
      <p id="welcomeMessage"></p>
        <input type="text" id="teacherName" placeholder="Teacher Name" required>
        <input type="text" id="teacherID" placeholder="Teacher ID" required>
        <input type="text" id="schoolName" placeholder="School Name" required>
        <a href="{% url 'discussion_forum' %}" onclick="signIn()">Sign In</a>
        
    </div>

    <script>
        function signIn() {
            let name = document.getElementById("teacherName").value;
            let id = document.getElementById("teacherID").value;
            let school = document.getElementById("schoolName").value;

            if (name && id && school) {
                // Store teacher details in local storage
                localStorage.setItem("teacherName", name);

                // Show welcome message with the teacher's name
                document.getElementById("welcomeMessage").innerText = 
                    `Welcome ${name} to the discussion forum! You can start your discussion.`;

                // Display the discussion box
                document.getElementById("discussionBox").style.display = "block";

                // Clear input fields after sign-in
                document.getElementById("teacherName").value = "";
                document.getElementById("teacherID").value = "";
                document.getElementById("schoolName").value = "";
            } else {
                alert("Please fill all fields.");
            }
        }
        
    </script>
</body>
</html>
